version: '3.8'

services:
  app:
    image: mbirk2/archive
    container_name: calory-count
    networks:
      calory-count-network:
        ipv4_address: 192.168.0.121
    ports:
      - "8080:80"
    deploy:
      update_config:
        parallelism: 1
        order: start-first
    restart: always
    pull_policy: always
  archive-db:
    image: 'postgres:16.3'
    container_name: archive-db
    networks:
      calory-count-network:
        ipv4_address: 192.168.0.122
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=archive-db
      - POSTGRES_PASSWORD=V40jN2gavmfj1q9Ln5Aq
      - PGUSER=archive-db
      - POSTGRES_DB=archive
networks:
  archive-network:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1
          ip_range: 192.168.0.120/29