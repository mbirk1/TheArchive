<div class="bg-neutral/80 backdrop-blur-xl fixed top-0 w-full z-50">
  <div class="flex items-center justify-between px-8 py-4 max-w-none mx-auto">
    <div class="flex items-center gap-8 cursor-pointer" routerLink="">
      <div class="flex items-center gap-2">
        <img
          src="/images/logo-blue-background.png"
          alt="Logo"
          class="text-primary h-16"
        />
        <h2 class="text-primary font-bold text-2xl font-headline">
          The Archive
        </h2>
      </div>
      <div
        class="hidden md:flex items-center gap-6 font-headline tracking-tight text-on-surface"
      >
        <app-header-chip
          [text]="'Library'"
          (click)="navigateToCollection()"
        ></app-header-chip>
        <app-header-chip
          [text]="'Decks'"
          (click)="navigateToDecks()"
        ></app-header-chip>
      </div>
    </div>
    @if (this.isUserLoggedIn()) {
      <div class="flex m-4 text-text-primary gap-4">
        <button
          class="menu bg-gradient-to-br from-primary to-on-primary-container text-on-primary px-6 py-2 rounded-md font-headline font-bold hover:scale-105 active:scale-95 transition-all duration-300"
          (click)="navigateToLoginSignUp()"
        >
          [Hier Profilbild einfügen]
        </button>
      </div>
    } @else {
      <div class="flex m-4">
        <button
          class="menu text-[#94a3b8] hover:text-on-surface transition-colors font-headline px-4 py-2"
          (click)="navigateToLoginSignUp()"
        >
          Login
        </button>
        <button
          class="menu bg-gradient-to-br from-primary to-on-primary-container text-on-primary px-6 py-2 rounded-md font-headline font-bold hover:scale-105 active:scale-95 transition-all duration-300"
          (click)="navigateToLoginSignUp()"
        >
          Registrieren
        </button>
      </div>
    }
  </div>
</div>
