@let isUserLoading = userService.isUserLoading();
@let isCollectionLoading = collectionService.isCollectionLoading();
@if (!isUserLoading && !isCollectionLoading) {
  <header class="relative mb-12 p-8 rounded-xl overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img
        alt="abstract mystical energy"
        class="w-full h-full object-cover opacity-20"
        data-alt="abstract flowing mystical energy in deep blues and violets with subtle grain and ethereal light patterns"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEUAvHxHYWSUKVqd2GZCCg1vQtK7Xoz_v9IQ3oj2VYRsQ1f5wZrI1RAx7ptliNMAXOW6sQnY1u4-JbUuZ3SlCGzRPJQP5qiX9pLv_DvM9EirEiw_RYjeS95ZpKHi6pGXlte_APYWBmKOlXVBo_36FIcyusD5FyDxBGICs0V3IsZaAhwR6ptnoUAt0v9M2xKqSi4wOSa72kfJ2MR9rCLv9UjeFMKCKftEfhDMwm3X4rcGw72X3-X3S59kr5UHhyM-YdaQ7JI9fAWFxZ"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"
      ></div>
    </div>
    <div
      class="relative z-10 flex flex-col float-right md:flex-row justify-between items-end gap-8"
    >
      <div class="flex gap-4 w-full md:w-auto">
        <div
          class="flex-1 md:flex-none glass-card p-4 rounded-lg border border-outline-variant/20 min-w-[140px]"
        >
          <span class="block text-on-surface-variant text-xs font-label mb-1"
            >Total Cards</span
          >
          <span class="text-2xl font-bold font-headline text-primary">
            {{ totalCardsForUser }}</span
          >
        </div>
        <div
          class="flex-1 md:flex-none glass-card p-4 rounded-lg border border-outline-variant/20 min-w-[140px]"
        >
          <span class="block text-on-surface-variant text-xs font-label mb-1"
            >Est. Value</span
          >
          <span class="text-2xl font-bold font-headline text-tertiary"
            >{{ estValue() }}€</span
          >
        </div>
      </div>
    </div>
  </header>
}
