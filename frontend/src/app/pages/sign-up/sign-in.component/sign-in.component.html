<form class="space-y-5">
  <div class="space-y-2">
    <label class="block text-sm font-label text-on-surface-variant" for="email"
      >Email</label
    >
    <div class="relative group">
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
        >alternate_email</span
      >
      <input
        class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
        id="email"
        placeholder="archivist@archive.io"
        type="email"
      />
    </div>
  </div>
  <div class="space-y-2">
    <div class="flex justify-between items-center">
      <label
        class="block text-sm font-label text-on-surface-variant"
        for="password"
        >Passwort</label
      >
      <a
        class="text-xs text-primary/80 hover:text-primary transition-colors"
        href="#"
        >Passwort vergessen</a
      >
    </div>
    <div class="relative group">
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
        >lock</span
      >
      <input
        class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
        id="password"
        placeholder="••••••••••••"
        type="password"
      />
      <span
        class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer hover:text-on-surface transition-colors"
        >visibility</span
      >
    </div>
  </div>
  <div class="flex items-center gap-2">
    <input
      class="w-4 h-4 rounded-sm bg-surface-container-lowest border-outline-variant/20 text-primary focus:ring-offset-background"
      id="remember"
      type="checkbox"
    />
    <label class="text-xs text-on-surface-variant" for="remember"
      >Angemeldet bleiben</label
    >
  </div>
  <button
    class="w-full py-4 px-6 rounded-lg font-headline font-bold text-on-primary bg-gradient-to-br from-primary to-on-primary-container hover:shadow-[0_0_20px_rgba(103,211,255,0.3)] transition-all active:scale-[0.98]"
    type="submit"
  >
    ANMELDEN
  </button>
</form>
