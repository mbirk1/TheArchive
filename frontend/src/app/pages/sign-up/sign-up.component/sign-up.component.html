<div class="space-y-6">
  <form
    class="space-y-4"
    (ngSubmit)="createUser()"
    [formGroup]="userDataFormGroup"
  >
    <div class="space-y-2">
      <label
        class="block text-sm font-label text-on-surface-variant"
        for="reg-username"
        >Benutzername</label
      >
      <div class="relative group">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
          >person</span
        >
        <input
          class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
          id="reg-username"
          placeholder="Archivist_420"
          type="text"
          formControlName="userName"
        />
      </div>
    </div>
    <div class="space-y-2">
      <label
        class="block text-sm font-label text-on-surface-variant"
        for="reg-email"
        >Email</label
      >
      <div class="relative group">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
          >mail</span
        >
        <input
          class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
          id="reg-email"
          placeholder="new.archivist@archive.io"
          type="email"
          formControlName="eMail"
        />
      </div>
    </div>
    <div class="space-y-2">
      <label
        class="block text-sm font-label text-on-surface-variant"
        for="reg-password"
        >Passwort</label
      >
      <div class="relative group">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
          >key</span
        >
        <input
          class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
          id="reg-password"
          placeholder="••••••••••••"
          type="password"
          formControlName="password"
        />
      </div>
    </div>
    <div class="space-y-2">
      <label
        class="block text-sm font-label text-on-surface-variant"
        for="reg-confirm"
        >Passwort bestätigen</label
      >
      <div class="relative group">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
          >verified</span
        >
        <input
          class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
          id="reg-confirm"
          placeholder="••••••••••••"
          type="password"
          formControlName="confirmPassword"
        />
      </div>
    </div>
    <button
      class="w-full py-4 px-6 mt-2 rounded-lg font-headline font-bold text-on-surface bg-surface-container-highest hover:bg-surface-variant border border-primary/20 hover:border-primary/40 transition-all active:scale-[0.98]"
      type="submit"
    >
      Account erstellen
    </button>
  </form>
</div>
