<main class="pt-24 pb-20 px-4 md:px-8 max-w-7xl mx-auto">
  <!-- Hero Profile Header -->
  <app-hero-profile-header />
  <!-- Search and Filter Bar -->
  <section class="mb-8 flex flex-col md:flex-row gap-4 items-center">
    <div class="relative flex-1 w-full group">
      <span
        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
        >search</span
      >
      <input
        class="w-full bg-surface-container-lowest border-none rounded-sm py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/20 transition-all"
        placeholder="Search collection by name, type, or set..."
        type="text"
      />
    </div>
    <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
      <button
        class="flex items-center gap-2 px-4 py-3 bg-surface-container-high rounded-full text-on-surface-variant hover:text-on-surface transition-colors whitespace-nowrap"
      >
        <span class="material-symbols-outlined text-sm">filter_list</span>
        <span class="font-label text-sm">Rarity</span>
      </button>
      <button
        class="flex items-center gap-2 px-4 py-3 bg-surface-container-high rounded-full text-on-surface-variant hover:text-on-surface transition-colors whitespace-nowrap"
      >
        <span class="material-symbols-outlined text-sm">palette</span>
        <span class="font-label text-sm">Color</span>
      </button>
      <button
        class="flex items-center gap-2 px-4 py-3 bg-secondary-container text-on-secondary-container rounded-full whitespace-nowrap"
      >
        <span class="material-symbols-outlined text-sm">payments</span>
        <span class="font-label text-sm">Value High-Low</span>
      </button>
    </div>
  </section>
  <!-- Collection Grid -->
  <section
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"
  >
    @for (card of collectionService.getAllCardsInCollection(); track card.id) {
      <app-card-tile [card]="card" [isInCollectionSection]="true" />
    }
  </section>
  <!-- Load More Section -->
  <div class="mt-16 flex flex-col items-center gap-6">
    <button
      class="px-8 py-3 bg-surface-container-high hover:bg-surface-container-highest text-on-surface rounded-md border border-outline-variant/20 transition-all font-label"
    >
      Show More Masterpieces
    </button>
    <p class="text-on-surface-variant text-sm italic">
      Displaying 10 of 12,482 cards in Eldritch_Seeker's collection.
    </p>
  </div>
</main>
