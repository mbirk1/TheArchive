<main class="ml-64 pt-28 px-8 pb-12 min-h-screen">
  <div class="flex justify-between items-end mb-10">
    <div>
      <h2
        class="text-4xl font-display font-bold text-on-surface tracking-tight"
      >
        Alle Karten
      </h2>
    </div>
    <div class="relative group">
      <span
        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors"
        >search</span
      >
      <input
        class="w-full bg-surface-container-lowest border-none rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container transition-all"
        id="serach-text"
        placeholder="Forest, ..."
        type="text"
        (keyup)="this.filterCards($event)"
      />
    </div>
    <div class="flex space-x-3">
      <div class="flex bg-surface-container rounded-sm p-1">
        <button
          class="px-6 py-1.5 rounded-sm bg-secondary-container text-on-secondary-container text-[10px] font-bold uppercase tracking-widest transition-all"
        >
          Grid
        </button>
        <button
          class="px-6 py-1.5 rounded-sm text-on-surface-variant text-[10px] font-bold uppercase tracking-widest hover:text-on-surface transition-all"
        >
          List
        </button>
      </div>
    </div>
  </div>
  <div
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
  >
    @for (card of cards().data; track card.id) {
      <app-card-tile [card]="card" [isInCollectionSection]="false" />
    }
  </div>
  <div class="mt-16 flex items-center justify-center space-x-2">
    <button
      class="w-10 h-10 cursor-pointer rounded-sm bg-surface-container-low border border-outline-variant/10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-all"
    >
      <span class="material-symbols-outlined">chevron_left</span>
    </button>
    <div class="flex space-x-1 font-display">
      @for (page of visiblePages(); track page) {
        @if (page === '...') {
          <span
            class="w-10 h-10 flex items-center justify-center text-on-surface-variant"
          >
            ...
          </span>
        } @else {
          <button
            class="w-10 h-10 rounded-sm"
            [ngClass]="{
              'bg-primary text-on-primary font-bold': page === currentPage(),
              'cursor-pointer bg-surface-container-low border border-outline-variant/10 text-on-surface-variant hover:bg-surface-variant transition-all':
                page !== currentPage(),
            }"
            (click)="goToPage(page)"
          >
            {{ page + 1 }}
          </button>
        }
      }
    </div>
    <button
      class="w-10 h-10 cursor-pointer rounded-sm bg-surface-container-low border border-outline-variant/10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-all"
      (click)="goToPage(currentPage() + 1)"
    >
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
  </div>
</main>
